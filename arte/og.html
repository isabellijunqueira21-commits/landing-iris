<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: #2C0A12 url('/midia/fundo-nebulosa.jpg') center / cover no-repeat;
    font-family: 'Lora', Georgia, serif;
  }

  /* véu vinho: a nebulosa é o clima, não o assunto */
  .veu {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(44,10,18,.92) 0%, rgba(44,10,18,.72) 46%, rgba(44,10,18,.34) 100%);
  }

  /* brilho dourado atrás da Íris */
  .halo {
    position: absolute; top: 50%; right: 130px;
    width: 620px; height: 620px; margin-top: -310px;
    background: radial-gradient(circle, rgba(201,151,58,.30), transparent 62%);
  }

  .quadro {
    position: absolute; inset: 0;
    padding: 62px 70px;
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
  }

  .texto { position: relative; max-width: 660px; }

  .marca { display: flex; align-items: baseline; gap: 16px; margin-bottom: 54px; }
  .marca b {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 700; font-size: 46px; letter-spacing: 1px; color: #FDFAF6;
  }
  .marca span {
    font-size: 15px; font-weight: 500; letter-spacing: 4.5px;
    text-transform: uppercase; color: #C9973A;
  }

  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600; font-size: 82px; line-height: 1.04;
    color: #FDFAF6; letter-spacing: -0.5px;
  }
  h1 em { font-style: normal; color: #E0B45C; }

  .fio {
    width: 96px; height: 2px; margin: 34px 0 26px;
    background: linear-gradient(90deg, #E8C170, #C9973A);
  }

  p {
    font-size: 25px; line-height: 1.55; color: #E8D9C3; max-width: 620px; text-wrap: balance;
  }

  .iris { position: relative; flex-shrink: 0; }
  .iris .anel {
    position: absolute; top: 50%; left: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
  }
  .anel-1 { width: 400px; height: 400px; border: 1px solid rgba(201,151,58,.30); }
  .anel-2 { width: 496px; height: 496px; border: 1px dashed rgba(201,151,58,.17); }
  .iris img {
    position: relative; display: block; width: 340px;
    filter: drop-shadow(0 30px 46px rgba(0,0,0,.55));
  }
</style>
</head>
<body>
  <div class="veu"></div>
  <div class="halo"></div>

  <div class="quadro">
    <div class="texto">
      <div class="marca">
        <b>Íris</b>
        <span>Estudos Jurídicos</span>
      </div>
      <h1>Sua <em>professora particular</em> de Direito</h1>
      <div class="fio"></div>
      <p>Da graduação à aprovação, com uma professora de IA 24 horas.</p>
    </div>

    <div class="iris">
      <div class="anel anel-1"></div>
      <div class="anel anel-2"></div>
      <img src="/midia/iris-boas-vindas.png" alt="">
    </div>
  </div>
</body>
</html>
